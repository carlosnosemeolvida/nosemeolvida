<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoSeMeOlvida</title>
  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#4f46e5">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="NoSeMeOlvida">
</head>
<body>

  <!-- ============================================
       SECCIÓN DE LOGIN / REGISTRO
       ============================================ -->
  <div id="seccion-login">
    <div class="container-login">
      
      <header class="header-login">
        <h1>🔔 NoSeMeOlvida</h1>
        <p class="subtitle">Nunca más te multen por olvidar una fecha</p>
      </header>

      <div class="card-login">
        
        <!-- Tabs -->
        <div class="tabs">
          <button class="tab activo" data-tab="login">Iniciar sesión</button>
          <button class="tab" data-tab="registro">Crear cuenta</button>
        </div>

        <!-- Formulario de Login -->
        <form id="form-login">
          <input 
            type="email" 
            id="email" 
            placeholder="tu@email.com" 
            required
            autocomplete="email"
          >
          <input 
            type="password" 
            id="password" 
            placeholder="Contraseña" 
            required
            autocomplete="current-password"
            minlength="6"
          >
          <button type="submit">Entrar</button>
        </form>

        <!-- Formulario de Registro -->
        <form id="form-registro" style="display: none;">
          <input 
            type="email" 
            id="email-reg" 
            placeholder="tu@email.com" 
            required
            autocomplete="email"
          >
          <input 
            type="password" 
            id="password-reg" 
            placeholder="Contraseña (mínimo 6 caracteres)" 
            required
            autocomplete="new-password"
            minlength="6"
          >
          <button type="submit">Crear cuenta</button>
        </form>

        <!-- Mensaje de estado -->
        <p id="mensaje-login" class="mensaje"></p>

      </div>

    </div>
  </div>

  <!-- ============================================
       SECCIÓN DE LA APP (después de login)
       ============================================ -->
  <div id="seccion-app" style="display: none;">
    <div class="container">
      
      <header>
        <h1>🔔 NoSeMeOlvida</h1>
        <p class="subtitle">Nunca más te multen por olvidar una fecha</p>
        <div class="user-bar">
          <span id="user-email"></span>
          <button id="btn-cerrar-sesion" title="Cerrar sesión">Salir</button>
        </div>
      </header>

      <section class="form-section">
        <h2>Agregar vencimiento</h2>
        <form id="form-vencimiento">
          <input 
            type="text" 
            id="nombre" 
            placeholder="Ej: Declaración SAT" 
            required
          >
          <input 
            type="date" 
            id="fecha" 
            required
          >
              <label class="modal-label" style="margin-top: 4px;">Avisarme antes</label>
    <select id="dias-aviso" required>
      <option value="1">1 día antes</option>
      <option value="3" selected>3 días antes</option>
      <option value="5">5 días antes</option>
      <option value="7">7 días antes</option>
      <option value="15">15 días antes</option>
      <option value="30">30 días antes</option>
    </select>
        <label class="modal-label">Categoría</label>
    <select id="categoria" required>
      <option value="fiscal">📋 Fiscal</option>
      <option value="escuela">🎓 Escuela</option>
      <option value="hogar">🏠 Hogar</option>
      <option value="negocio">💼 Negocio</option>
      <option value="financiero">💳 Financiero</option>
      <option value="otro" selected>📌 Otro</option>
    </select>
        <label class="modal-label">Notas (opcional)</label>
    <textarea 
      id="notas" 
      placeholder="Ej: Pagar con tarjeta BBVA"
      rows="2"
    ></textarea>
          <button type="submit">+ Agregar</button>
        </form>
      </section>

      <section class="lista-section">
        <h2>Mis vencimientos</h2>
            <input 
      type="text" 
      id="buscador" 
      placeholder="🔍 Buscar vencimiento..." 
      class="buscador"
      autocomplete="off"
    >
        <div id="toggle-vista" class="toggle-vista">
      <button class="vista-btn activo" data-vista="proximos">📅 Próximos</button>
      <button class="vista-btn" data-vista="historial">✓ Historial</button>
    </div>
        <div id="filtros-categoria" class="filtros-categoria">
      <button class="filtro-btn activo" data-categoria="todas">Todos</button>
      <button class="filtro-btn" data-categoria="fiscal">📋 Fiscal</button>
      <button class="filtro-btn" data-categoria="escuela">🎓 Escuela</button>
      <button class="filtro-btn" data-categoria="hogar">🏠 Hogar</button>
      <button class="filtro-btn" data-categoria="negocio">💼 Negocio</button>
      <button class="filtro-btn" data-categoria="financiero">💳 Financiero</button>
      <button class="filtro-btn" data-categoria="otro">📌 Otro</button>
    </div>
        <div id="lista"></div>
            <div id="loader" class="loader" style="display: none;">
      <div class="spinner"></div>
      <p>Cargando...</p>
    </div>
        <div id="toast" class="toast" style="display: none;"></div>
        <p id="vacio" class="vacio">Aún no tienes vencimientos. Agrega el primero arriba 👆</p>
      </section>

    </div>
  </div>

    <!-- ============================================
       MODAL EDITAR VENCIMIENTO
       ============================================ -->
  <div id="modal-editar" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <h2 class="modal-title">Editar vencimiento</h2>
      
      <form id="form-editar" class="modal-form">
        <label class="modal-label">Nombre</label>
        <input 
          type="text" 
          id="editar-nombre" 
          placeholder="Ej: Declaración SAT" 
          required
        >
        
        <label class="modal-label">Fecha</label>
        <input 
          type="date" 
          id="editar-fecha" 
          required
        >

        <label class="modal-label">Avisarme antes</label>
        <select id="editar-dias-aviso" required>
          <option value="1">1 día antes</option>
          <option value="3">3 días antes</option>
          <option value="5">5 días antes</option>
          <option value="7">7 días antes</option>
          <option value="15">15 días antes</option>
          <option value="30">30 días antes</option>
        </select>
                
        <label class="modal-label">Categoría</label>
        <select id="editar-categoria" required>
          <option value="fiscal">📋 Fiscal</option>
          <option value="escuela">🎓 Escuela</option>
          <option value="hogar">🏠 Hogar</option>
          <option value="negocio">💼 Negocio</option>
          <option value="financiero">💳 Financiero</option>
          <option value="otro">📌 Otro</option>
        </select>
                
        <label class="modal-label">Notas (opcional)</label>
        <textarea 
          id="editar-notas" 
          placeholder="Ej: Pagar con tarjeta BBVA"
          rows="2"
        ></textarea>
        
        <div class="modal-botones">
          <button type="button" id="btn-cancelar-edicion" class="btn-cancelar">
            Cancelar
          </button>
          <button type="submit" class="btn-guardar">
            Guardar
          </button>
        </div>
      </form>
    </div>
  </div>
  <script type="module" src="app.js"></script>

</body>
</html>
