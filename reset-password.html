<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cambiar contraseña - NoSeMeOlvida</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔔</text></svg>">
</head>
<body>
  <div id="seccion-login">
    <div class="container-login">
      
      <header class="header-login">
        <h1>🔔 NoSeMeOlvida</h1>
        <p class="subtitle">Elige tu nueva contraseña</p>
      </header>

      <div class="card-login">
        
        <!-- Formulario de nueva contraseña -->
        <form id="form-reset">
          <input 
            type="password" 
            id="nueva-password" 
            placeholder="Nueva contraseña (mínimo 6 caracteres)" 
            required
            minlength="6"
            autocomplete="new-password"
          >
          <input 
            type="password" 
            id="confirmar-password" 
            placeholder="Confirmar nueva contraseña" 
            required
            minlength="6"
            autocomplete="new-password"
          >
          <button type="submit">Cambiar contraseña</button>
        </form>

        <p id="mensaje-reset" class="mensaje"></p>

        <p style="text-align: center; margin-top: 20px; font-size: 13px; color: #999;">
          <a href="index.html" style="color: #4f46e5; text-decoration: none;">Volver al inicio</a>
        </p>

      </div>

    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

    const SUPABASE_URL = 'https://mglyeepyjyningcjzasz.supabase.co'
    const SUPABASE_ANON_KEY = 'yJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1nbHllZXB5anluaW5nY2p6YXN6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzMDk0MzUsImV4cCI6MjEwNjg4NTQzNX0.glYqLHkGFfxk9iLBufGTDB3gJ2t-utNQkqnb86K_yTge'

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    const form = document.getElementById('form-reset')
    const inputNueva = document.getElementById('nueva-password')
    const inputConfirmar = document.getElementById('confirmar-password')
    const mensaje = document.getElementById('mensaje-reset')

    // Procesar el token que Supabase envía en el hash (#)
    async function procesarToken() {
      const hash = window.location.hash.substring(1)
      const params = new URLSearchParams(hash)
      const accessToken = params.get('access_token')
      const refreshToken = params.get('refresh_token')

      if (!accessToken || !refreshToken) {
        mensaje.textContent = '⚠️ Enlace inválido o expirado. Solicita uno nuevo.'
        mensaje.style.color = '#ef4444'
        form.style.display = 'none'
        return false
      }

      const { error } = await supabase.auth.setSession({
        access_token: accessToken,
        refresh_token: refreshToken
      })

      if (error) {
        mensaje.textContent = '⚠️ Error al validar el enlace: ' + error.message
        mensaje.style.color = '#ef4444'
        form.style.display = 'none'
        return false
      }

      mensaje.textContent = '✅ Enlace válido. Escribe tu nueva contraseña.'
      mensaje.style.color = '#10b981'
      return true
    }

    // Cambiar contraseña
    form.addEventListener('submit', async (e) => {
      e.preventDefault()
      
      const nueva = inputNueva.value
      const confirmar = inputConfirmar.value

      if (nueva !== confirmar) {
        mensaje.textContent = '⚠️ Las contraseñas no coinciden'
        mensaje.style.color = '#ef4444'
        return
      }

      if (nueva.length < 6) {
        mensaje.textContent = '⚠️ La contraseña debe tener al menos 6 caracteres'
        mensaje.style.color = '#ef4444'
        return
      }

      mensaje.textContent = 'Cambiando contraseña...'
      mensaje.style.color = '#666'

      const { error } = await supabase.auth.updateUser({ password: nueva })

      if (error) {
        mensaje.textContent = '❌ Error: ' + error.message
        mensaje.style.color = '#ef4444'
        return
      }

      mensaje.textContent = '🎉 ¡Contraseña cambiada! Redirigiendo al inicio de sesión...'
      mensaje.style.color = '#10b981'

      // Esperar 2 segundos y redirigir
      setTimeout(() => {
        window.location.href = '/'
      }, 2000)
    })

    // Al cargar, procesar el token
    procesarToken()
  </script>

</body>
</html>
